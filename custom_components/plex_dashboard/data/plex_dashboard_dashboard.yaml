# =============================================================================
#  PLEX DASHBOARD  –  4 column layout
#  Drop into:  /config/dashboards/plex_dashboard.yaml
#  Then in configuration.yaml:
#     lovelace:
#       mode: storage     # leave default
#       dashboards:
#         plex-dashboard:
#           mode: yaml
#           title: Plex
#           icon: mdi:plex
#           show_in_sidebar: true
#           filename: dashboards/plex_dashboard.yaml
#
#  ---- HACS REQUIREMENTS (frontend) ----
#    - auto-entities          (custom:auto-entities)
#    - mini-media-player      (custom:mini-media-player)
#    - upcoming-media-card    (recently added / sonarr / radarr)
#  Built-in cards (gauge, tile, markdown, entities, conditional) replace the
#  previous mushroom + bar-card + button-card dependencies, so HACS no longer
#  needs them.
#
#  ---- PLACEHOLDERS ----
#    PLEX_SERVER_NAME    -> server slug (sensor.plex_<slug>)
#    Replace any sensor.plex_library_PLEX_SERVER_NAME_* names with the ones
#    your Plex integration created (Developer Tools → States → search "plex").
# =============================================================================

title: Plex
views:
  # ===========================================================================
  # MAIN VIEW
  # ===========================================================================
  - title: Overview
    path: overview
    icon: mdi:plex
    type: sections
    max_columns: 4
    sections:

      # =======================================================================
      # COLUMN 1 – SERVER + QUICK STATS
      # =======================================================================
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Plex Server
            heading_style: title
            icon: mdi:plex

          - type: tile
            entity: sensor.plex_server_online
            name: Plex Media Server
            icon: mdi:plex
            color: orange
            tap_action:
              action: url
              url_path: https://app.plex.tv/desktop

          # ---------- Quick stats row (built-in markdown) ----------
          - type: markdown
            content: >-
              <ha-icon icon="mdi:play" style="color:#4caf50"></ha-icon>
              **{{ state_attr('sensor.plex_active_streams','playing') or 0 }}**
              &nbsp;&nbsp;
              <ha-icon icon="mdi:pause" style="color:#ff9800"></ha-icon>
              **{{ state_attr('sensor.plex_active_streams','paused') or 0 }}**
              &nbsp;&nbsp;
              <ha-icon icon="mdi:loading" style="color:#2196f3"></ha-icon>
              **{{ state_attr('sensor.plex_active_streams','buffering') or 0 }}**
              &nbsp;&nbsp;
              <ha-icon icon="mdi:speedometer" style="color:#9c27b0"></ha-icon>
              **{{ states('sensor.plex_total_bandwidth_mbps') }} Mbps**

          # ---------- Bandwidth gauge (built-in) ----------
          - type: gauge
            entity: sensor.plex_total_bandwidth_mbps
            name: Bandwidth
            unit: Mbps
            min: 0
            max: 200
            needle: true
            severity:
              green: 0
              yellow: 50
              red: 120

          # ---------- Server actions ----------
          - type: horizontal-stack
            cards:
              - type: tile
                entity: script.plex_scan_all_libraries
                name: Scan
                icon: mdi:database-refresh
                color: blue
                tap_action:
                  action: call-service
                  service: script.plex_scan_all_libraries
              - type: tile
                entity: script.plex_pause_all
                name: Pause All
                icon: mdi:pause-octagon
                color: amber
                tap_action:
                  action: call-service
                  service: script.plex_pause_all
              - type: tile
                entity: sensor.plex_server_online
                name: Open Web
                icon: mdi:open-in-new
                color: orange
                tap_action:
                  action: url
                  url_path: https://app.plex.tv/desktop

          # ---------- Library counts (auto-entities) ----------
          - type: heading
            heading: Libraries
            heading_style: subtitle
            icon: mdi:bookshelf

          # Library counts via auto-entities. We use `else:` (a fallback card
          # rendered when zero entities match) instead of `show_empty:false`,
          # because some HA versions render the zero-entity entities-card as
          # a "Configuration error" tile. The else card is a tiny markdown
          # hint pointing the user at the Plex integration's Configure page.
          - type: custom:auto-entities
            card:
              type: entities
              state_color: false
            filter:
              include:
                - entity_id: sensor.plex_library_*
                  options:
                    secondary_info: last-changed
              exclude:
                - state: "unavailable"
            sort:
              method: name
            else:
              type: markdown
              content: >-
                _No Plex library sensors found._<br>
                Enable them under **Settings → Devices & Services →
                Plex → Configure**.

      # =======================================================================
      # COLUMN 2 – NOW PLAYING (auto-generated per active client)
      # =======================================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Now Playing
            heading_style: title
            icon: mdi:play-circle

          # Empty-state card
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.plex_anything_playing
                state: "off"
            card:
              type: markdown
              content: |
                ### <ha-icon icon="mdi:sleep"></ha-icon> Nothing is playing
                _All Plex clients are idle_

          # Auto-entities: one rich mini-media-player per active stream.
          # mini-media-player handles artwork, title, progress, and controls.
          #
          # NOTE: per auto-entities docs, the `options:` block (which receives
          # the `this.entity_id` substitution) MUST live inside each
          # `filter.include[]` entry, not at the top level of auto-entities --
          # a top-level `options:` is silently ignored, which is what made
          # earlier versions emit broken cards with no `type:`.
          #
          # We keep the mini-media-player config minimal -- many of its
          # options (hide.power, hide.volume, info: scroll, etc.) trigger
          # "Configuration error" on certain mini-media-player versions when
          # passed through auto-entities' substitution. The defaults already
          # produce a clean card.
          - type: custom:auto-entities
            show_empty: false
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: media_player.plex_*
                  state: playing
                  options:
                    type: custom:mini-media-player
                    entity: this.entity_id
                    artwork: cover
                - entity_id: media_player.plex_*
                  state: paused
                  options:
                    type: custom:mini-media-player
                    entity: this.entity_id
                    artwork: cover
                - entity_id: media_player.plex_*
                  state: buffering
                  options:
                    type: custom:mini-media-player
                    entity: this.entity_id
                    artwork: cover
              exclude:
                - state: "unavailable"
                - state: "unknown"
                - state: "off"
                - state: "idle"
            sort:
              method: state
              reverse: true

      # =======================================================================
      # COLUMN 4 – CLIENTS + RECENTLY ADDED
      # =======================================================================
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Clients
            heading_style: title
            icon: mdi:monitor-multiple

          # All Plex clients (active + idle)
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              title: ""
            filter:
              include:
                - entity_id: media_player.plex_*
              exclude:
                - state: "unavailable"
            sort:
              method: state
              reverse: true

          - type: heading
            heading: Recently Added
            heading_style: title
            icon: mdi:new-box

          # Recently Added cards.
          #
          # History note: previous versions wrapped each card in
          # `type: conditional` with `condition: template`. In HA Sections
          # views (type: sections + type: grid children) the conditional +
          # template-condition combination renders as "Configuration error"
          # red tiles even when wrapped in a vertical-stack. Coming Soon
          # view proves upcoming-media-card itself handles missing sensors
          # gracefully (renders empty progress bar instead of erroring),
          # so we just render the cards directly. Much simpler, and
          # actually works.
          #
          # Use auto-entities for the filter pill so a missing helper is
          # handled by `show_empty: false` rather than a conditional.
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
            filter:
              include:
                - entity_id: input_select.plex_dashboard_recently_added_filter
                  options:
                    name: Show

          # Movies / TV / Music recently added.
          # If sensor.plex_recently_added_* doesn't exist, upcoming-media-card
          # renders an empty progress bar (see Coming Soon view for the
          # same behavior with sensor.radarr_upcoming_media). Install the
          # optional `plex_recently_added` HACS integration to populate.
          - type: custom:upcoming-media-card
            entity: sensor.plex_recently_added_movies
            title: New Movies
            image_style: poster
            max: 6
            date: mmdd

          - type: custom:upcoming-media-card
            entity: sensor.plex_recently_added_tv
            title: New Episodes
            image_style: poster
            max: 6
            date: mmdd

          - type: custom:upcoming-media-card
            entity: sensor.plex_recently_added_music
            title: New Albums
            image_style: poster
            max: 6
            date: mmdd

  # ===========================================================================
  # SECONDARY VIEW – Coming Soon (Sonarr / Radarr)
  # ===========================================================================
  - title: Coming Soon
    path: coming-soon
    icon: mdi:calendar-clock
    type: sections
    max_columns: 4
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Upcoming Movies (Radarr)
            icon: mdi:movie-roll
          - type: custom:upcoming-media-card
            entity: sensor.radarr_upcoming_media
            title: ""
            image_style: fanart
            max: 8
            date: mmdd

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Upcoming Episodes (Sonarr)
            icon: mdi:television-classic
          - type: custom:upcoming-media-card
            entity: sensor.sonarr_upcoming_media
            title: ""
            image_style: fanart
            max: 8
            date: mmdd

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Settings
            icon: mdi:cog
          - type: entities
            entities:
              - entity: input_boolean.plex_dashboard_show_paused
              - entity: input_boolean.plex_dashboard_show_offline_clients
              - entity: input_select.plex_dashboard_recently_added_filter
