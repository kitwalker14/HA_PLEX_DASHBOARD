# =============================================================================
#  PLEX DASHBOARD  –  4 column layout
#  Drop into:  /config/dashboards/plex_dashboard.yaml
#  Then in configuration.yaml:
#     lovelace:
#       mode: storage     # leave default
#       dashboards:
#         plex-dashboard:
#           mode: yaml
#           title: Plex
#           icon: mdi:plex
#           show_in_sidebar: true
#           filename: dashboards/plex_dashboard.yaml
#
#  ---- HACS REQUIREMENTS (frontend) ----
#    - auto-entities          (custom:auto-entities)
#    - button-card            (custom:button-card)
#    - mini-media-player      (custom:mini-media-player)
#    - upcoming-media-card    (recently added / sonarr / radarr)
#  Built-in cards (gauge, tile, markdown, entities) replace the previous
#  mushroom + bar-card dependencies, so HACS no longer needs them.
#
#  ---- PLACEHOLDERS ----
#    PLEX_SERVER_NAME    -> server slug (sensor.plex_<slug>)
#    Replace any sensor.plex_library_PLEX_SERVER_NAME_* names with the ones
#    your Plex integration created (Developer Tools → States → search "plex").
# =============================================================================

title: Plex
views:
  # ===========================================================================
  # MAIN VIEW
  # ===========================================================================
  - title: Overview
    path: overview
    icon: mdi:plex
    type: sections
    max_columns: 4
    sections:

      # =======================================================================
      # COLUMN 1 – SERVER + QUICK STATS
      # =======================================================================
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Plex Server
            heading_style: title
            icon: mdi:plex

          - type: tile
            entity: sensor.plex_server_online
            name: Plex Media Server
            icon: mdi:plex
            color: orange
            tap_action:
              action: url
              url_path: https://app.plex.tv/desktop

          # ---------- Quick stats row (built-in markdown) ----------
          - type: markdown
            content: >-
              <ha-icon icon="mdi:play" style="color:#4caf50"></ha-icon>
              **{{ state_attr('sensor.plex_active_streams','playing') or 0 }}**
              &nbsp;&nbsp;
              <ha-icon icon="mdi:pause" style="color:#ff9800"></ha-icon>
              **{{ state_attr('sensor.plex_active_streams','paused') or 0 }}**
              &nbsp;&nbsp;
              <ha-icon icon="mdi:loading" style="color:#2196f3"></ha-icon>
              **{{ state_attr('sensor.plex_active_streams','buffering') or 0 }}**
              &nbsp;&nbsp;
              <ha-icon icon="mdi:speedometer" style="color:#9c27b0"></ha-icon>
              **{{ states('sensor.plex_total_bandwidth_mbps') }} Mbps**

          # ---------- Bandwidth gauge (built-in) ----------
          - type: gauge
            entity: sensor.plex_total_bandwidth_mbps
            name: Bandwidth
            unit: Mbps
            min: 0
            max: 200
            needle: true
            severity:
              green: 0
              yellow: 50
              red: 120

          # ---------- Server actions ----------
          - type: horizontal-stack
            cards:
              - type: tile
                entity: script.plex_scan_all_libraries
                name: Scan
                icon: mdi:database-refresh
                color: blue
                tap_action:
                  action: call-service
                  service: script.plex_scan_all_libraries
              - type: tile
                entity: script.plex_pause_all
                name: Pause All
                icon: mdi:pause-octagon
                color: amber
                tap_action:
                  action: call-service
                  service: script.plex_pause_all
              - type: tile
                entity: sensor.plex_server_online
                name: Open Web
                icon: mdi:open-in-new
                color: orange
                tap_action:
                  action: url
                  url_path: https://app.plex.tv/desktop

          # ---------- Library counts (auto-entities) ----------
          - type: heading
            heading: Libraries
            heading_style: subtitle
            icon: mdi:bookshelf

          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              state_color: false
            filter:
              include:
                - entity_id: sensor.plex_library_*
                  options:
                    secondary_info: last-changed
              exclude:
                - state: "unavailable"
            sort:
              method: name

          # Hint shown when no library sensors are exposed by the Plex
          # integration (auto-entities returns an empty card and is hidden
          # via show_empty:false above; this markdown explains how to enable
          # them). It's harmless when libraries do appear because users will
          # see both, so we wrap it in a template condition.
          - type: conditional
            conditions:
              - condition: template
                value_template: >-
                  {{ states.sensor
                     | selectattr('entity_id','match','^sensor\\.plex_library_')
                     | list | count == 0 }}
            card:
              type: markdown
              content: >-
                _No Plex library sensors found._<br>
                Enable them under **Settings → Devices & Services →
                Plex → Configure**.

      # =======================================================================
      # COLUMN 2 – NOW PLAYING (auto-generated per active client)
      # =======================================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Now Playing
            heading_style: title
            icon: mdi:play-circle

          # Empty-state card
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.plex_anything_playing
                state: "off"
            card:
              type: markdown
              content: |
                ### <ha-icon icon="mdi:sleep"></ha-icon> Nothing is playing
                _All Plex clients are idle_

          # Auto-entities: one rich card per active stream
          - type: custom:auto-entities
            show_empty: false
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: media_player.plex_*
                  state: playing
                - entity_id: media_player.plex_*
                  state: paused
                - entity_id: media_player.plex_*
                  state: buffering
              exclude:
                - state: "unavailable"
                - state: "unknown"
                - state: "off"
                - state: "idle"
            sort:
              method: state
              reverse: true
            options:
              type: custom:mini-media-player
              entity: this.entity_id
              artwork: full-cover-fanart
              hide:
                power: true
                source: false
                info: false
                progress: false
                runtime: true
                volume: true
              info: scroll
              icon: mdi:plex
              tap_action:
                action: more-info

          # Detailed metadata block per active stream (button-card)
          - type: custom:auto-entities
            show_empty: false
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: media_player.plex_*
                  state: playing
                - entity_id: media_player.plex_*
                  state: paused
            options:
              type: custom:button-card
              entity: this.entity_id
              show_name: false
              show_state: false
              show_icon: false
              styles:
                card:
                  - padding: 12px
                  - border-radius: 12px
                  - background: 'rgba(0,0,0,0.35)'
                  - color: white
                grid:
                  - grid-template-areas: '"art info"'
                  - grid-template-columns: 130px 1fr
                  - grid-gap: 14px
              custom_fields:
                art: |
                  [[[
                    const img = entity.attributes.entity_picture
                      || entity.attributes.entity_picture_local
                      || '/local/images/plex_placeholder.png';
                    return `<img src="${img}" style="width:130px;border-radius:8px;
                            box-shadow:0 4px 14px rgba(0,0,0,.5);" />`;
                  ]]]
                info: |
                  [[[
                    const a = entity.attributes;
                    const title  = a.media_title || 'Unknown';
                    const series = a.media_series_title;
                    const season = a.media_season;
                    const ep     = a.media_episode;
                    const album  = a.media_album_name;
                    const artist = a.media_artist;
                    const dur    = a.media_duration;
                    const pos    = a.media_position;
                    const pct    = (dur && pos) ? Math.round((pos/dur)*100) : 0;
                    const fmt    = (s)=> {
                      if(!s) return '';
                      const m=Math.floor(s/60), sec=Math.floor(s%60).toString().padStart(2,'0');
                      const h=Math.floor(m/60), mm=(m%60).toString().padStart(2,'0');
                      return h>0 ? `${h}:${mm}:${sec}` : `${m}:${sec}`;
                    };
                    const sub = series
                      ? `${series} · S${String(season).padStart(2,'0')}E${String(ep).padStart(2,'0')}`
                      : (artist ? `${artist}${album?' · '+album:''}` : (a.media_content_type||''));
                    return `
                      <div style="display:flex;flex-direction:column;gap:6px;">
                        <div style="font-size:1.05em;font-weight:600;line-height:1.2;">${title}</div>
                        <div style="opacity:.85;font-size:.9em;">${sub}</div>
                        <div style="opacity:.7;font-size:.8em;">
                          <ha-icon icon="mdi:account" style="--mdc-icon-size:14px;"></ha-icon>
                          ${entity.attributes.friendly_name || ''} ·
                          <ha-icon icon="mdi:circle" style="--mdc-icon-size:10px;color:${
                            entity.state==='playing'?'#4caf50':entity.state==='paused'?'#ff9800':'#2196f3'
                          };"></ha-icon> ${entity.state}
                        </div>
                        <div style="background:rgba(255,255,255,.15);height:6px;border-radius:3px;overflow:hidden;margin-top:4px;">
                          <div style="background:#e5a00d;height:100%;width:${pct}%;"></div>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:.75em;opacity:.7;">
                          <span>${fmt(pos)}</span><span>${fmt(dur)}</span>
                        </div>
                      </div>`;
                  ]]]

      # =======================================================================
      # COLUMN 4 – CLIENTS + RECENTLY ADDED
      # =======================================================================
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Clients
            heading_style: title
            icon: mdi:monitor-multiple

          # All Plex clients (active + idle)
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              title: ""
            filter:
              include:
                - entity_id: media_player.plex_*
              exclude:
                - state: "unavailable"
            sort:
              method: state
              reverse: true

          - type: heading
            heading: Recently Added
            heading_style: title
            icon: mdi:new-box

          # Filter pill
          - type: entities
            entities:
              - entity: input_select.plex_recently_added_filter
                name: Show

          # Movies recently added
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "TV"
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "Music"
              - condition: template
                value_template: >-
                  {{ states('sensor.plex_recently_added_movies') not in
                     ['unknown','unavailable','none'] and
                     states.sensor.plex_recently_added_movies is not none }}
            card:
              type: custom:upcoming-media-card
              entity: sensor.plex_recently_added_movies
              title: New Movies
              image_style: poster
              max: 6
              date: mmdd

          # TV recently added
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "Movies"
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "Music"
              - condition: template
                value_template: >-
                  {{ states('sensor.plex_recently_added_tv') not in
                     ['unknown','unavailable','none'] and
                     states.sensor.plex_recently_added_tv is not none }}
            card:
              type: custom:upcoming-media-card
              entity: sensor.plex_recently_added_tv
              title: New Episodes
              image_style: poster
              max: 6
              date: mmdd

          # Music recently added
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "Movies"
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "TV"
              - condition: template
                value_template: >-
                  {{ states('sensor.plex_recently_added_music') not in
                     ['unknown','unavailable','none'] and
                     states.sensor.plex_recently_added_music is not none }}
            card:
              type: custom:upcoming-media-card
              entity: sensor.plex_recently_added_music
              title: New Albums
              image_style: poster
              max: 6
              date: mmdd

          # Fallback: shown when none of the recently-added sensors exist.
          # The optional `plex_recently_added` custom integration creates them.
          - type: conditional
            conditions:
              - condition: template
                value_template: >-
                  {{ states.sensor.plex_recently_added_movies is none and
                     states.sensor.plex_recently_added_tv is none and
                     states.sensor.plex_recently_added_music is none }}
            card:
              type: markdown
              content: >-
                _No `sensor.plex_recently_added_*` entities found._<br><br>
                Install the optional
                [**plex_recently_added**](https://github.com/custom-components/plex_recently_added)
                custom integration via HACS → Integrations to populate
                this section with new movies, episodes, and albums.

  # ===========================================================================
  # SECONDARY VIEW – Coming Soon (Sonarr / Radarr)
  # ===========================================================================
  - title: Coming Soon
    path: coming-soon
    icon: mdi:calendar-clock
    type: sections
    max_columns: 4
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Upcoming Movies (Radarr)
            icon: mdi:movie-roll
          - type: custom:upcoming-media-card
            entity: sensor.radarr_upcoming_media
            title: ""
            image_style: fanart
            max: 8
            date: mmdd

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Upcoming Episodes (Sonarr)
            icon: mdi:television-classic
          - type: custom:upcoming-media-card
            entity: sensor.sonarr_upcoming_media
            title: ""
            image_style: fanart
            max: 8
            date: mmdd

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Settings
            icon: mdi:cog
          - type: entities
            entities:
              - entity: input_boolean.plex_show_paused
              - entity: input_boolean.plex_show_offline_clients
              - entity: input_select.plex_recently_added_filter
