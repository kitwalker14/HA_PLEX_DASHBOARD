# =============================================================================
#  PLEX DASHBOARD  –  4 column layout
#  Drop into:  /config/dashboards/plex_dashboard.yaml
#  Then in configuration.yaml:
#     lovelace:
#       mode: storage     # leave default
#       dashboards:
#         plex-dashboard:
#           mode: yaml
#           title: Plex
#           icon: mdi:plex
#           show_in_sidebar: true
#           filename: dashboards/plex_dashboard.yaml
#
#  ---- HACS REQUIREMENTS ----
#    - mushroom               (frontend cards)
#    - button-card            (custom:button-card)
#    - mini-media-player      (custom:mini-media-player)
#    - bar-card               (custom:bar-card)
#    - auto-entities          (custom:auto-entities)
#    - card-mod               (styling)
#    - upcoming-media-card    (recently added / sonarr / radarr)
#    - layout-card (optional, only if you want even more layout control)
#
#  ---- PLACEHOLDERS ----
#    PLEX_SERVER_NAME    -> server slug (sensor.plex_<slug>)
#    Replace any sensor.plex_library_PLEX_SERVER_NAME_* names with the ones
#    your Plex integration created (Developer Tools → States → search "plex").
# =============================================================================

title: Plex
views:
  # ===========================================================================
  # MAIN VIEW
  # ===========================================================================
  - title: Overview
    path: overview
    icon: mdi:plex
    type: sections
    max_columns: 4
    sections:

      # =======================================================================
      # COLUMN 1 – SERVER + QUICK STATS
      # =======================================================================
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Plex Server
            heading_style: title
            icon: mdi:plex

          - type: custom:mushroom-template-card
            primary: Plex Media Server
            secondary: >-
              {{ 'Online' if is_state('sensor.plex_server_online','on') else 'Offline' }}
              · {{ states('sensor.plex_active_streams') }} stream(s)
            icon: mdi:plex
            icon_color: >-
              {{ 'orange' if is_state('sensor.plex_server_online','on') else 'red' }}
            badge_icon: >-
              {{ 'mdi:check-circle' if is_state('sensor.plex_server_online','on') else 'mdi:alert' }}
            badge_color: >-
              {{ 'green' if is_state('sensor.plex_server_online','on') else 'red' }}
            tap_action:
              action: url
              url_path: https://app.plex.tv/desktop

          # ---------- Quick chip row ----------
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:play
                content: "{{ state_attr('sensor.plex_active_streams','playing') or 0 }}"
                icon_color: green
              - type: template
                icon: mdi:pause
                content: "{{ state_attr('sensor.plex_active_streams','paused') or 0 }}"
                icon_color: amber
              - type: template
                icon: mdi:loading
                content: "{{ state_attr('sensor.plex_active_streams','buffering') or 0 }}"
                icon_color: blue
              - type: template
                icon: mdi:speedometer
                content: "{{ states('sensor.plex_total_bandwidth_mbps') }} Mbps"
                icon_color: purple

          # ---------- Bandwidth bar ----------
          - type: custom:bar-card
            entities:
              - entity: sensor.plex_total_bandwidth_mbps
                name: Bandwidth
            positions:
              icon: 'off'
              indicator: 'off'
              name: inside
              value: inside
            min: 0
            max: 200
            severity:
              - color: '#4caf50'
                from: 0
                to: 50
              - color: '#ff9800'
                from: 50
                to: 120
              - color: '#f44336'
                from: 120
                to: 200

          # ---------- Server actions ----------
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Scan
                secondary: Libraries
                icon: mdi:database-refresh
                icon_color: blue
                tap_action:
                  action: call-service
                  service: script.plex_scan_all_libraries
              - type: custom:mushroom-template-card
                primary: Pause
                secondary: All streams
                icon: mdi:pause-octagon
                icon_color: amber
                tap_action:
                  action: call-service
                  service: script.plex_pause_all
              - type: custom:mushroom-template-card
                primary: Open
                secondary: web app
                icon: mdi:open-in-new
                icon_color: orange
                tap_action:
                  action: url
                  url_path: https://app.plex.tv/desktop

          # ---------- Library counts (auto-entities) ----------
          - type: heading
            heading: Libraries
            heading_style: subtitle
            icon: mdi:bookshelf

          - type: custom:auto-entities
            card:
              type: entities
              state_color: false
            filter:
              include:
                - entity_id: sensor.plex_library_*
                  options:
                    secondary_info: last-changed
              exclude:
                - state: "unavailable"
            sort:
              method: name

      # =======================================================================
      # COLUMN 2 – NOW PLAYING (auto-generated per active client)
      # =======================================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Now Playing
            heading_style: title
            icon: mdi:play-circle

          # Empty-state card
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.plex_anything_playing
                state: "off"
            card:
              type: custom:mushroom-template-card
              primary: Nothing is playing
              secondary: All Plex clients are idle
              icon: mdi:sleep
              icon_color: grey

          # Auto-entities: one rich card per active stream
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: media_player.plex_*
                  state: playing
                - entity_id: media_player.plex_*
                  state: paused
                - entity_id: media_player.plex_*
                  state: buffering
              exclude:
                - state: "unavailable"
                - state: "unknown"
                - state: "off"
                - state: "idle"
            sort:
              method: state
              reverse: true
            options:
              type: custom:mini-media-player
              entity: this.entity_id
              artwork: full-cover-fanart
              hide:
                power: true
                source: false
                info: false
                progress: false
                runtime: true
                volume: true
              info: scroll
              icon: mdi:plex
              tap_action:
                action: more-info
              shortcuts:
                buttons:
                  - icon: mdi:play-pause
                    type: service
                    id: media_player.media_play_pause
                    data:
                      entity_id: this.entity_id
                  - icon: mdi:stop
                    type: service
                    id: media_player.media_stop
                    data:
                      entity_id: this.entity_id
                  - icon: mdi:skip-next
                    type: service
                    id: media_player.media_next_track
                    data:
                      entity_id: this.entity_id

          # Detailed metadata block per active stream (button-card)
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: media_player.plex_*
                  state: playing
                - entity_id: media_player.plex_*
                  state: paused
            options:
              type: custom:button-card
              entity: this.entity_id
              show_name: false
              show_state: false
              show_icon: false
              styles:
                card:
                  - padding: 12px
                  - border-radius: 12px
                  - background: 'rgba(0,0,0,0.35)'
                  - color: white
                grid:
                  - grid-template-areas: '"art info"'
                  - grid-template-columns: 130px 1fr
                  - grid-gap: 14px
              custom_fields:
                art: |
                  [[[
                    const img = entity.attributes.entity_picture
                      || entity.attributes.entity_picture_local
                      || '/local/images/plex_placeholder.png';
                    return `<img src="${img}" style="width:130px;border-radius:8px;
                            box-shadow:0 4px 14px rgba(0,0,0,.5);" />`;
                  ]]]
                info: |
                  [[[
                    const a = entity.attributes;
                    const title  = a.media_title || 'Unknown';
                    const series = a.media_series_title;
                    const season = a.media_season;
                    const ep     = a.media_episode;
                    const album  = a.media_album_name;
                    const artist = a.media_artist;
                    const dur    = a.media_duration;
                    const pos    = a.media_position;
                    const pct    = (dur && pos) ? Math.round((pos/dur)*100) : 0;
                    const fmt    = (s)=> {
                      if(!s) return '';
                      const m=Math.floor(s/60), sec=Math.floor(s%60).toString().padStart(2,'0');
                      const h=Math.floor(m/60), mm=(m%60).toString().padStart(2,'0');
                      return h>0 ? `${h}:${mm}:${sec}` : `${m}:${sec}`;
                    };
                    const sub = series
                      ? `${series} · S${String(season).padStart(2,'0')}E${String(ep).padStart(2,'0')}`
                      : (artist ? `${artist}${album?' · '+album:''}` : (a.media_content_type||''));
                    return `
                      <div style="display:flex;flex-direction:column;gap:6px;">
                        <div style="font-size:1.05em;font-weight:600;line-height:1.2;">${title}</div>
                        <div style="opacity:.85;font-size:.9em;">${sub}</div>
                        <div style="opacity:.7;font-size:.8em;">
                          <ha-icon icon="mdi:account" style="--mdc-icon-size:14px;"></ha-icon>
                          ${entity.attributes.friendly_name || ''} ·
                          <ha-icon icon="mdi:circle" style="--mdc-icon-size:10px;color:${
                            entity.state==='playing'?'#4caf50':entity.state==='paused'?'#ff9800':'#2196f3'
                          };"></ha-icon> ${entity.state}
                        </div>
                        <div style="background:rgba(255,255,255,.15);height:6px;border-radius:3px;overflow:hidden;margin-top:4px;">
                          <div style="background:#e5a00d;height:100%;width:${pct}%;"></div>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:.75em;opacity:.7;">
                          <span>${fmt(pos)}</span><span>${fmt(dur)}</span>
                        </div>
                      </div>`;
                  ]]]

      # =======================================================================
      # COLUMN 4 – CLIENTS + RECENTLY ADDED
      # =======================================================================
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Clients
            heading_style: title
            icon: mdi:monitor-multiple

          # All Plex clients (active + idle)
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
            filter:
              include:
                - entity_id: media_player.plex_*
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    primary: |
                      {{ state_attr(entity,'friendly_name') | replace('Plex (','') | replace(')','') }}
                    secondary: |
                      {% set s = states(entity) %}
                      {% if s in ['playing','paused','buffering'] %}
                        {{ state_attr(entity,'media_title') or 'Streaming' }}
                      {% else %}
                        {{ s | title }}
                      {% endif %}
                    icon: |
                      {% set s = states(entity) %}
                      {% if s == 'playing' %}mdi:play
                      {% elif s == 'paused' %}mdi:pause
                      {% elif s == 'buffering' %}mdi:loading
                      {% else %}mdi:monitor
                      {% endif %}
                    icon_color: |
                      {% set s = states(entity) %}
                      {% if s == 'playing' %}green
                      {% elif s == 'paused' %}amber
                      {% elif s == 'buffering' %}blue
                      {% else %}grey
                      {% endif %}
                    tap_action:
                      action: more-info
              exclude:
                - state: "unavailable"
            sort:
              method: state
              reverse: true

          - type: heading
            heading: Recently Added
            heading_style: title
            icon: mdi:new-box

          # Filter pill
          - type: entities
            entities:
              - entity: input_select.plex_recently_added_filter
                name: Show

          # Movies recently added
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "TV"
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "Music"
            card:
              type: custom:upcoming-media-card
              entity: sensor.plex_recently_added_movies
              title: New Movies
              image_style: poster
              max: 6
              date: mmdd

          # TV recently added
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "Movies"
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "Music"
            card:
              type: custom:upcoming-media-card
              entity: sensor.plex_recently_added_tv
              title: New Episodes
              image_style: poster
              max: 6
              date: mmdd

          # Music recently added
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "Movies"
              - condition: state
                entity: input_select.plex_recently_added_filter
                state_not: "TV"
            card:
              type: custom:upcoming-media-card
              entity: sensor.plex_recently_added_music
              title: New Albums
              image_style: poster
              max: 6
              date: mmdd

  # ===========================================================================
  # SECONDARY VIEW – Coming Soon (Sonarr / Radarr)
  # ===========================================================================
  - title: Coming Soon
    path: coming-soon
    icon: mdi:calendar-clock
    type: sections
    max_columns: 4
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Upcoming Movies (Radarr)
            icon: mdi:movie-roll
          - type: custom:upcoming-media-card
            entity: sensor.radarr_upcoming_media
            title: ""
            image_style: fanart
            max: 8
            date: mmdd

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Upcoming Episodes (Sonarr)
            icon: mdi:television-classic
          - type: custom:upcoming-media-card
            entity: sensor.sonarr_upcoming_media
            title: ""
            image_style: fanart
            max: 8
            date: mmdd

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Settings
            icon: mdi:cog
          - type: entities
            entities:
              - entity: input_boolean.plex_show_paused
              - entity: input_boolean.plex_show_offline_clients
              - entity: input_select.plex_recently_added_filter
