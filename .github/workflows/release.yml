name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extras zip
        run: |
          mkdir -p dist/staging
          cp -r extras dist/staging/
          cp -r scripts dist/staging/
          cp README.md LICENSE CHANGELOG.md dist/staging/
          cd dist/staging
          zip -r ../plex_dashboard_extras.zip .
          cd ../..
          ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/plex_dashboard_extras.zip
          body: |
            See [CHANGELOG.md](CHANGELOG.md) for changes.

            ## Install

            **Theme** – install via HACS (Themes → "Plex Dashboard").

            **Dashboard files** – one-liner:
            ```sh
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/plex_dashboard_extras.zip -o /tmp/pd.zip
            unzip -o /tmp/pd.zip -d /tmp/pd
            HA_CONFIG=/config /tmp/pd/scripts/install.sh
            ```
