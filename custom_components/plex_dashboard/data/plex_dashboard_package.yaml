# =============================================================================
#  PLEX DASHBOARD PACKAGE
#  Installed by the Plex Dashboard integration into:
#     /config/packages/plex_dashboard.yaml
#
#  The integration ensures `homeassistant.packages` is configured.
#  The PLEX_SERVER_NAME placeholder is auto-substituted on install with the
#  slug supplied during config flow.
#
#  Helpers (input_boolean / input_select) are defined here as YAML helpers.
#  They appear under Settings -> Devices & services -> Helpers as read-only
#  YAML entries (cannot be edited from the UI, but reload-safe and never
#  silently disappear).
# =============================================================================

# -----------------------------------------------------------------------------
# HELPERS (YAML-defined, read-only in UI but reload-safe)
# -----------------------------------------------------------------------------
input_boolean:
  plex_dashboard_show_paused:
    name: Show paused streams
    icon: mdi:pause-circle-outline
  plex_dashboard_show_offline_clients:
    name: Show idle clients
    icon: mdi:monitor-off

input_select:
  plex_dashboard_recently_added_filter:
    name: Recently added filter
    icon: mdi:filter-variant
    options:
      - All
      - Movies
      - TV
      - Music
    initial: All

# -----------------------------------------------------------------------------
# TEMPLATE SENSORS
# -----------------------------------------------------------------------------
template:
  - sensor:
      # ---------- Active Plex stream count ----------
      - name: "Plex Active Streams"
        unique_id: plex_active_streams
        icon: mdi:play-network
        unit_of_measurement: "streams"
        state: >-
          {{ states.media_player
             | selectattr('entity_id','match','^media_player\\.plex_')
             | selectattr('state','in',['playing','paused','buffering'])
             | list | count }}
        attributes:
          playing: >-
            {{ states.media_player
               | selectattr('entity_id','match','^media_player\\.plex_')
               | selectattr('state','eq','playing')
               | list | count }}
          paused: >-
            {{ states.media_player
               | selectattr('entity_id','match','^media_player\\.plex_')
               | selectattr('state','eq','paused')
               | list | count }}
          buffering: >-
            {{ states.media_player
               | selectattr('entity_id','match','^media_player\\.plex_')
               | selectattr('state','eq','buffering')
               | list | count }}

      # ---------- Active client list (entity_ids) ----------
      - name: "Plex Active Client IDs"
        unique_id: plex_active_client_ids
        icon: mdi:account-multiple
        state: >-
          {{ states.media_player
             | selectattr('entity_id','match','^media_player\\.plex_')
             | selectattr('state','in',['playing','paused','buffering'])
             | map(attribute='entity_id') | list | count }}
        attributes:
          entities: >-
            {{ states.media_player
               | selectattr('entity_id','match','^media_player\\.plex_')
               | selectattr('state','in',['playing','paused','buffering'])
               | map(attribute='entity_id') | list }}

      # ---------- Total bandwidth (from Tautulli, optional) ----------
      # NOTE: We deliberately do NOT set device_class:data_rate because HA's
      # data_rate device class only accepts canonical units (bit/s, Mbit/s,
      # MB/s, etc.), and "Mbps" is not in that allow-list -- it would make
      # the gauge card raise a "Configuration error". Plain unit_of_measurement
      # is sufficient for display in the gauge.
      - name: "Plex Total Bandwidth Mbps"
        unique_id: plex_total_bandwidth_mbps
        icon: mdi:speedometer
        unit_of_measurement: "Mbps"
        state: >-
          {%- set tautulli = states('sensor.tautulli_bandwidth_total') -%}
          {%- if tautulli not in ['unknown','unavailable','none', None] -%}
            {{ (tautulli | float(0) / 1000) | round(1) }}
          {%- else -%}
            0
          {%- endif -%}

      # ---------- Plex server up/down ----------
      - name: "Plex Server Online"
        unique_id: plex_server_online
        icon: mdi:plex
        state: >-
          {% set s = states('sensor.plex_PLEX_SERVER_NAME') %}
          {{ 'on' if s not in ['unavailable','unknown','none', None] else 'off' }}

      # ---------- Recently Added: filtered by media type ----------
      #
      # The optional `plex_recently_added` HACS integration publishes a
      # single sensor (entity_id is substituted at install time via the
      # integration's config flow). Its `data` attribute is a list of
      # items covering ALL media types -- movies, TV episodes, music
      # videos, YouTube clips, etc. The first list entry is always a
      # "header" template entry (no `airdate`) which we skip.
      #
      # upcoming-media-card reads the `data` attribute directly, so we
      # expose three filtered views as template sensors. The state is
      # just a count; the card uses the `data` attribute.
      #
      # Classification heuristics (no media_type field exists in the
      # source data):
      #   TV     = `episode` is a non-empty string
      #   Movies = no episode AND has tmdb_id AND has genres AND runtime >= 40
      #   Music  = everything else (music videos, concerts, short clips,
      #            demos, YouTube rips -- typically short runtime, no
      #            tmdb_id, empty genres)
      #
      # If the source sensor is missing (integration not installed) each
      # filter sensor returns 0 / empty list and upcoming-media-card
      # renders an empty progress bar -- same graceful degradation as the
      # Radarr/Sonarr cards in the Coming Soon view.
      - name: "Plex Recently Added Movies"
        unique_id: plex_recently_added_movies
        icon: mdi:movie-open
        state: >-
          {%- set src = state_attr('PLEX_RECENTLY_ADDED_SENSOR','data') or [] -%}
          {%- set ns = namespace(c=0) -%}
          {%- for i in src if i.airdate is defined -%}
            {%- set ep = i.episode | default('') -%}
            {%- set tmdb = i.tmdb_id | default(none) -%}
            {%- set genres = i.genres | default('') -%}
            {%- set runtime = i.runtime | default(0) | int(0) -%}
            {%- if ep == '' and tmdb and genres and runtime >= 40 -%}
              {%- set ns.c = ns.c + 1 -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.c }}
        attributes:
          data: >-
            {%- set src = state_attr('PLEX_RECENTLY_ADDED_SENSOR','data') or [] -%}
            {%- set header = (src | selectattr('airdate','undefined') | list) -%}
            {%- set items = [] -%}
            {%- set ns = namespace(items=[]) -%}
            {%- for i in src if i.airdate is defined -%}
              {%- set ep = i.episode | default('') -%}
              {%- set tmdb = i.tmdb_id | default(none) -%}
              {%- set genres = i.genres | default('') -%}
              {%- set runtime = i.runtime | default(0) | int(0) -%}
              {%- if ep == '' and tmdb and genres and runtime >= 40 -%}
                {%- set ns.items = ns.items + [i] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ header + ns.items }}

      - name: "Plex Recently Added TV"
        unique_id: plex_recently_added_tv
        icon: mdi:television-classic
        state: >-
          {%- set src = state_attr('PLEX_RECENTLY_ADDED_SENSOR','data') or [] -%}
          {%- set ns = namespace(c=0) -%}
          {%- for i in src if i.airdate is defined -%}
            {%- if (i.episode | default('')) != '' -%}
              {%- set ns.c = ns.c + 1 -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.c }}
        attributes:
          data: >-
            {%- set src = state_attr('PLEX_RECENTLY_ADDED_SENSOR','data') or [] -%}
            {%- set header = (src | selectattr('airdate','undefined') | list) -%}
            {%- set ns = namespace(items=[]) -%}
            {%- for i in src if i.airdate is defined -%}
              {%- if (i.episode | default('')) != '' -%}
                {%- set ns.items = ns.items + [i] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ header + ns.items }}

      - name: "Plex Recently Added Music"
        unique_id: plex_recently_added_music
        icon: mdi:music
        state: >-
          {%- set src = state_attr('PLEX_RECENTLY_ADDED_SENSOR','data') or [] -%}
          {%- set ns = namespace(c=0) -%}
          {%- for i in src if i.airdate is defined -%}
            {%- set ep = i.episode | default('') -%}
            {%- set tmdb = i.tmdb_id | default(none) -%}
            {%- set genres = i.genres | default('') -%}
            {%- set runtime = i.runtime | default(0) | int(0) -%}
            {#- Music/other = not TV, and not a 'real' movie. -#}
            {%- if ep == '' and not (tmdb and genres and runtime >= 40) -%}
              {%- set ns.c = ns.c + 1 -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.c }}
        attributes:
          data: >-
            {%- set src = state_attr('PLEX_RECENTLY_ADDED_SENSOR','data') or [] -%}
            {%- set header = (src | selectattr('airdate','undefined') | list) -%}
            {%- set ns = namespace(items=[]) -%}
            {%- for i in src if i.airdate is defined -%}
              {%- set ep = i.episode | default('') -%}
              {%- set tmdb = i.tmdb_id | default(none) -%}
              {%- set genres = i.genres | default('') -%}
              {%- set runtime = i.runtime | default(0) | int(0) -%}
              {%- if ep == '' and not (tmdb and genres and runtime >= 40) -%}
                {%- set ns.items = ns.items + [i] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ header + ns.items }}

  # -------- Per-stream binary sensor (handy for automations) --------
  - binary_sensor:
      - name: "Plex Anything Playing"
        unique_id: plex_anything_playing
        icon: mdi:play-circle
        state: >-
          {{ states('sensor.plex_active_streams') | int(0) > 0 }}

# -----------------------------------------------------------------------------
# SCRIPTS – dashboard buttons
# -----------------------------------------------------------------------------
script:
  plex_scan_all_libraries:
    alias: "Plex: Scan All Libraries"
    icon: mdi:database-refresh
    sequence:
      - service: plex.scan_for_clients

  plex_pause_all:
    alias: "Plex: Pause All Streams"
    icon: mdi:pause
    sequence:
      # Guard: only call media_pause when there is at least one active
      # Plex client. Without this guard, a tap with no active streams
      # passes `None` as entity_id and raises in HA's service handler.
      - condition: template
        value_template: >-
          {{ states('sensor.plex_active_streams') | int(0) > 0 }}
      - service: media_player.media_pause
        target:
          entity_id: >-
            {{ state_attr('sensor.plex_active_client_ids','entities') or [] }}
