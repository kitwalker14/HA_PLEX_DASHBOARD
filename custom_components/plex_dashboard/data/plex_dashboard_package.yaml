# =============================================================================
#  PLEX DASHBOARD PACKAGE
#  Installed by the Plex Dashboard integration into:
#     /config/packages/plex_dashboard.yaml
#
#  The integration ensures `homeassistant.packages` is configured.
#  The PLEX_SERVER_NAME placeholder is auto-substituted on install with the
#  slug supplied during config flow.
#
#  Helpers (input_boolean / input_select) are defined here as YAML helpers.
#  They appear under Settings -> Devices & services -> Helpers as read-only
#  YAML entries (cannot be edited from the UI, but reload-safe and never
#  silently disappear).
# =============================================================================

# -----------------------------------------------------------------------------
# HELPERS (YAML-defined, read-only in UI but reload-safe)
# -----------------------------------------------------------------------------
input_boolean:
  plex_dashboard_show_paused:
    name: Show paused streams
    icon: mdi:pause-circle-outline
  plex_dashboard_show_offline_clients:
    name: Show idle clients
    icon: mdi:monitor-off

input_select:
  plex_dashboard_recently_added_filter:
    name: Recently added filter
    icon: mdi:filter-variant
    options:
      - All
      - Movies
      - TV
      - Music
    initial: All

# -----------------------------------------------------------------------------
# TEMPLATE SENSORS
# -----------------------------------------------------------------------------
template:
  - sensor:
      # ---------- Active Plex stream count ----------
      - name: "Plex Active Streams"
        unique_id: plex_active_streams
        icon: mdi:play-network
        unit_of_measurement: "streams"
        state: >-
          {{ states.media_player
             | selectattr('entity_id','match','^media_player\\.plex_')
             | selectattr('state','in',['playing','paused','buffering'])
             | list | count }}
        attributes:
          playing: >-
            {{ states.media_player
               | selectattr('entity_id','match','^media_player\\.plex_')
               | selectattr('state','eq','playing')
               | list | count }}
          paused: >-
            {{ states.media_player
               | selectattr('entity_id','match','^media_player\\.plex_')
               | selectattr('state','eq','paused')
               | list | count }}
          buffering: >-
            {{ states.media_player
               | selectattr('entity_id','match','^media_player\\.plex_')
               | selectattr('state','eq','buffering')
               | list | count }}

      # ---------- Active client list (entity_ids) ----------
      - name: "Plex Active Client IDs"
        unique_id: plex_active_client_ids
        icon: mdi:account-multiple
        state: >-
          {{ states.media_player
             | selectattr('entity_id','match','^media_player\\.plex_')
             | selectattr('state','in',['playing','paused','buffering'])
             | map(attribute='entity_id') | list | count }}
        attributes:
          entities: >-
            {{ states.media_player
               | selectattr('entity_id','match','^media_player\\.plex_')
               | selectattr('state','in',['playing','paused','buffering'])
               | map(attribute='entity_id') | list }}

      # ---------- Total bandwidth: REMOVED in v2.4.1 ----------
      # `sensor.plex_total_bandwidth_mbps` used to derive a Mbps figure from
      # Tautulli's `sensor.tautulli_total_bandwidth`. It has been removed
      # because it fails closed in the worst way: with no Tautulli install
      # the template still emitted the string "0", so `has_value()` was
      # true on the dashboard and the card confidently rendered "0 Mbps"
      # -- indistinguishable from a genuinely idle server. A stat that
      # cannot tell "no data" from "no traffic" is worse than no stat.
      #
      # Plex itself exposes no bandwidth total, so there is no first-party
      # replacement. If you run Tautulli and want this back, add a template
      # sensor reading `sensor.tautulli_total_bandwidth` (kbit/s; divide by
      # 1000). Do NOT set `device_class: data_rate` -- "Mbps" is not in
      # HA's allow-list for that class and every card validating the unit
      # will raise a configuration error.

      # ---------- Plex server up/down ----------
      - name: "Plex Server Online"
        unique_id: plex_server_online
        icon: mdi:plex
        state: >-
          {% set s = states('sensor.plex_PLEX_SERVER_NAME') %}
          {{ 'on' if s not in ['unavailable','unknown','none', None] else 'off' }}

      # ---------- Recently Added ----------
      #
      # Removed in v2.3.0: the three heuristic template sensors that
      # filtered the legacy unified `plex_recently_added` sensor by
      # inspecting `runtime` / `tmdb_id` / `genres` attributes are gone.
      # The current `plex_recently_added` HACS integration (v0.6+) ships
      # separate per-type sensors out of the box (`*_recently_added_movie`,
      # `_show`, `_artist`), and the dashboard now points
      # `upcoming-media-card` directly at the user-selected sensors via
      # config-flow placeholders. No template-sensor indirection needed.

  # -------- Per-stream binary sensor (handy for automations) --------
  - binary_sensor:
      - name: "Plex Anything Playing"
        unique_id: plex_anything_playing
        icon: mdi:play-circle
        state: >-
          {{ states('sensor.plex_active_streams') | int(0) > 0 }}

# -----------------------------------------------------------------------------
# SCRIPTS – dashboard buttons
# -----------------------------------------------------------------------------
script:
  plex_scan_all_libraries:
    alias: "Plex: Refresh All Libraries"
    icon: mdi:database-refresh
    mode: single
    sequence:
      # `plex.scan_for_clients` was REMOVED from HA core -- `refresh_library`
      # is now the only service the plex integration registers. That service
      # also never did what this script's name claims: it scanned for
      # *clients*, not libraries. (For client discovery, press the
      # `button.scan_clients_<server>` entity instead.)
      #
      # `plex.refresh_library` takes one required `library_name` per call,
      # so we iterate over every library the Plex integration exposes.
      # Library sensors are named "<server friendly name> Library - <title>",
      # so the argument we need is the text after " Library - ". This is
      # derived at runtime, so it works on any server name and picks up
      # newly added libraries with no reconfiguration.
      #
      # NOTE: do NOT use `integration_entities('plex')` here. That function
      # resolves its argument against config entry *titles* first, and the
      # Plex entry is titled after its URL (e.g. "http://host:32400"), so
      # 'plex' can silently match a different integration's entry and
      # return the wrong entities. Matching on the " Library - " naming
      # convention is both accurate and server-name agnostic. Iterating
      # states.sensor also naturally skips libraries the user has disabled,
      # since disabled entities have no state.
      - variables:
          plex_libraries: >-
            {% set ns = namespace(names=[]) %}
            {% for s in states.sensor %}
              {% if s.name is string and ' Library - ' in s.name %}
                {% set ns.names = ns.names + [s.name.split(' Library - ')[-1]] %}
              {% endif %}
            {% endfor %}
            {{ ns.names | unique | list }}
      - repeat:
          for_each: "{{ plex_libraries }}"
          sequence:
            - action: plex.refresh_library
              data:
                library_name: "{{ repeat.item }}"

  plex_pause_all:
    alias: "Plex: Pause All Streams"
    icon: mdi:pause
    sequence:
      # Guard: only call media_pause when there is at least one active
      # Plex client. Without this guard, a tap with no active streams
      # passes `None` as entity_id and raises in HA's service handler.
      - condition: template
        value_template: >-
          {{ states('sensor.plex_active_streams') | int(0) > 0 }}
      - action: media_player.media_pause
        target:
          entity_id: >-
            {{ state_attr('sensor.plex_active_client_ids','entities') or [] }}
