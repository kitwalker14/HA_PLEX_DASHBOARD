# =============================================================================
#  PLEX DASHBOARD  –  magazine grid layout (v2.4.0)
#  Drop into:  /config/dashboards/plex_dashboard.yaml
#  Then in configuration.yaml:
#     lovelace:
#       mode: storage     # leave default
#       dashboards:
#         plex-dashboard:
#           mode: yaml
#           title: Plex
#           icon: mdi:plex
#           show_in_sidebar: true
#           filename: dashboards/plex_dashboard.yaml
#
#  ---- HACS REQUIREMENTS (frontend) ----
#    - auto-entities          (custom:auto-entities)
#    - mini-media-player      (custom:mini-media-player)
#    - upcoming-media-card    (Recently Added posters only)
#  Built-in cards (tile, markdown, entities, conditional, calendar) replace the
#  previous mushroom + bar-card + button-card dependencies, so HACS no longer
#  needs them. Coming Soon uses the built-in `calendar` card as of v2.4.2.
#
#  ---- DEPLOYMENT-AGNOSTIC ----
#  This dashboard makes NO assumptions about your Plex server slug, which
#  optional integrations you have, or whether the package YAML helpers were
#  installed. Every block uses one of:
#    * `custom:auto-entities` with `show_empty: false` + an `else:` fallback,
#      so a missing entity collapses cleanly instead of erroring.
#    * Glob filters (`sensor.plex_*_library_*`) so any Plex server slug works.
#    * Defensive Jinja (`states('x') if has_value('x') else '0'`) in templates.
#  No `PLEX_SERVER_NAME` substitution is required at the dashboard level --
#  all server-slug references are filtered by glob.
# =============================================================================

title: Plex
views:
  # ===========================================================================
  # MAIN VIEW
  # ===========================================================================
  - title: Overview
    path: overview
    icon: mdi:plex
    type: sections
    max_columns: 4
    sections:

      # =======================================================================
      # ROW 1 / COL 1 – SERVER + QUICK STATS + ACTIONS
      # =======================================================================
      # Tighter than v2.3.x: the bandwidth gauge became a compact inline
      # stat in v2.4.0 and was dropped entirely in v2.4.1, freeing up
      # ~250px of vertical space and letting Now Playing breathe.
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Plex Server
            heading_style: title
            icon: mdi:plex

          # Server status tile. Wrapped in auto-entities so a missing
          # `sensor.plex_server_online` (created by the bundled package
          # YAML) collapses cleanly instead of rendering a red error tile.
          - type: custom:auto-entities
            show_empty: false
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: sensor.plex_server_online
                  options:
                    type: tile
                    entity: this.entity_id
                    name: Plex Media Server
                    icon: mdi:plex
                    color: orange
                    tap_action:
                      action: url
                      url_path: https://app.plex.tv/desktop

          # Compact quick-stats row. Uses defensive Jinja: every state
          # read is guarded with `has_value()` so missing template sensors
          # render as "0" instead of "unknown" or a red error tile.
          # v2.4.1: the inline Mbps stat was dropped together with its
          # sensor -- see plex_dashboard_package.yaml for the rationale.
          - type: markdown
            content: >-
              <ha-icon icon="mdi:play" style="color:#4caf50"></ha-icon>
              **{{ state_attr('sensor.plex_active_streams','playing')
                   if has_value('sensor.plex_active_streams') else 0 }}**
              &nbsp;&nbsp;
              <ha-icon icon="mdi:pause" style="color:#ff9800"></ha-icon>
              **{{ state_attr('sensor.plex_active_streams','paused')
                   if has_value('sensor.plex_active_streams') else 0 }}**
              &nbsp;&nbsp;
              <ha-icon icon="mdi:loading" style="color:#2196f3"></ha-icon>
              **{{ state_attr('sensor.plex_active_streams','buffering')
                   if has_value('sensor.plex_active_streams') else 0 }}**

          # Server actions. Scripts are created by the bundled package
          # YAML; wrap in auto-entities so missing scripts collapse.
          - type: custom:auto-entities
            show_empty: false
            card:
              type: horizontal-stack
            card_param: cards
            filter:
              include:
                - entity_id: script.plex_scan_all_libraries
                  options:
                    type: tile
                    entity: this.entity_id
                    name: Scan
                    icon: mdi:database-refresh
                    color: blue
                    tap_action:
                      action: call-service
                      service: script.plex_scan_all_libraries
                - entity_id: script.plex_pause_all
                  options:
                    type: tile
                    entity: this.entity_id
                    name: Pause All
                    icon: mdi:pause-octagon
                    color: amber
                    tap_action:
                      action: call-service
                      service: script.plex_pause_all
                - entity_id: sensor.plex_server_online
                  options:
                    type: tile
                    entity: this.entity_id
                    name: Open Web
                    icon: mdi:open-in-new
                    color: orange
                    tap_action:
                      action: url
                      url_path: https://app.plex.tv/desktop

      # =======================================================================
      # ROW 1 / COL 2 – NOW PLAYING (auto-generated per active client)
      # =======================================================================
      # v2.4.0: dropped from column_span:2 -> 1. With the bandwidth gauge
      # gone and Recently Added moved to its own full-width row below,
      # 1 column lines up cleanly with the other top-row sections and
      # avoids the giant empty middle area on wide displays.
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Now Playing
            heading_style: title
            icon: mdi:play-circle

          # Empty-state card. `condition: state` is safe even when the
          # entity is missing -- it simply won't match -- so this is fine
          # in HA Sections views (unlike `condition: template`, which
          # renders as red error tiles when the underlying sensor is
          # missing). If the package YAML wasn't installed, the card just
          # never appears.
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.plex_anything_playing
                state: "off"
            card:
              type: markdown
              content: |
                ### <ha-icon icon="mdi:sleep"></ha-icon> Nothing is playing
                _All Plex clients are idle_

          # Auto-entities: one rich mini-media-player per active stream.
          # mini-media-player handles artwork, title, progress, and controls.
          #
          # NOTE: per auto-entities docs, the `options:` block (which receives
          # the `this.entity_id` substitution) MUST live inside each
          # `filter.include[]` entry, not at the top level of auto-entities --
          # a top-level `options:` is silently ignored, which is what made
          # earlier versions emit broken cards with no `type:`.
          #
          # We keep the mini-media-player config minimal -- many of its
          # options (hide.power, hide.volume, info: scroll, etc.) trigger
          # "Configuration error" on certain mini-media-player versions when
          # passed through auto-entities' substitution. The defaults already
          # produce a clean card.
          # v2.4.2: `input_boolean.plex_dashboard_show_paused` is now actually
          # wired up. Through v2.4.1 the helper was rendered in the Settings
          # section but referenced by nothing at all -- no filter, template or
          # condition anywhere in this file -- so toggling it did nothing.
          # That was the single most visible "the dashboard is broken" symptom.
          #
          # Implemented as two `conditional`-wrapped copies rather than an
          # auto-entities `filter.template`, for the same reason documented on
          # the empty-state card above: `condition: state` degrades safely to
          # "no match" when the helper is missing, whereas a template filter
          # errors. The two conditions are deliberately asymmetric -- the
          # paused-inclusive card uses `state_not: "off"` so it still renders
          # when the helper does not exist at all (package YAML never
          # installed), preserving pre-v2.4.2 behaviour.
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.plex_dashboard_show_paused
                state_not: "off"
            card:
              type: custom:auto-entities
              show_empty: false
              card:
                type: vertical-stack
              card_param: cards
              filter:
                include:
                  - entity_id: media_player.plex_*
                    state: playing
                    options:
                      type: custom:mini-media-player
                      entity: this.entity_id
                      artwork: cover
                  - entity_id: media_player.plex_*
                    state: paused
                    options:
                      type: custom:mini-media-player
                      entity: this.entity_id
                      artwork: cover
                  - entity_id: media_player.plex_*
                    state: buffering
                    options:
                      type: custom:mini-media-player
                      entity: this.entity_id
                      artwork: cover
                exclude:
                  - state: "unavailable"
                  - state: "unknown"
                  - state: "off"
                  - state: "idle"
              sort:
                method: state
                reverse: true

          # Identical card with paused streams filtered out. Rendered only
          # when the helper is explicitly `off`.
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.plex_dashboard_show_paused
                state: "off"
            card:
              type: custom:auto-entities
              show_empty: false
              card:
                type: vertical-stack
              card_param: cards
              filter:
                include:
                  - entity_id: media_player.plex_*
                    state: playing
                    options:
                      type: custom:mini-media-player
                      entity: this.entity_id
                      artwork: cover
                  - entity_id: media_player.plex_*
                    state: buffering
                    options:
                      type: custom:mini-media-player
                      entity: this.entity_id
                      artwork: cover
                exclude:
                  - state: "unavailable"
                  - state: "unknown"
                  - state: "off"
                  - state: "idle"
                  - state: "paused"
              sort:
                method: state
                reverse: true

      # =======================================================================
      # ROW 1 / COL 3 – CLIENTS
      # =======================================================================
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Clients
            heading_style: title
            icon: mdi:monitor-multiple

          # All Plex clients. `unavailable` is ALWAYS excluded: the Plex
          # integration keeps a media_player entity for every client it has
          # ever seen, so on a mature install the overwhelming majority are
          # offline registry cruft (42 of 44 on the reference system) and
          # listing them is never useful.
          #
          # v2.4.2: `input_boolean.plex_dashboard_show_offline_clients`
          # ("Show idle clients") is now wired up -- through v2.4.1 it was,
          # like show_paused, referenced nowhere. It gates `idle`: a client
          # that is connected but not playing anything, which is the only
          # genuinely optional state here. As with Now Playing above, the
          # permissive card uses `state_not: "off"` so it still renders when
          # the helper is absent, preserving pre-v2.4.2 behaviour.
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.plex_dashboard_show_offline_clients
                state_not: "off"
            card:
              type: custom:auto-entities
              card:
                type: entities
                state_color: true
                title: ""
              filter:
                include:
                  - entity_id: media_player.plex_*
                exclude:
                  - state: "unavailable"
                  - state: "unknown"
              sort:
                method: state
                reverse: true
              else:
                type: markdown
                content: _No Plex clients are connected._

          # Active clients only (idle hidden).
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.plex_dashboard_show_offline_clients
                state: "off"
            card:
              type: custom:auto-entities
              card:
                type: entities
                state_color: true
                title: ""
              filter:
                include:
                  - entity_id: media_player.plex_*
                exclude:
                  - state: "unavailable"
                  - state: "unknown"
                  - state: "idle"
                  - state: "off"
              sort:
                method: state
                reverse: true
              else:
                type: markdown
                content: _No Plex clients are active._

      # =======================================================================
      # ROW 1 / COL 4 – LIBRARIES
      # =======================================================================
      # v2.4.0: promoted to its own top-row section (was nested under
      # Server in v2.3.x) so the magazine grid has 4 balanced top tiles.
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Libraries
            heading_style: title
            icon: mdi:bookshelf

          # Library counts via auto-entities. Plex creates library sensors
          # named `sensor.<server_friendly_name>_library_<library_name>`.
          # There is NO `plex_` prefix unless the server itself happens to
          # be named "Plex ..." -- the Plex library sensor does not set
          # `has_entity_name`, so the entity_id derives from the raw name
          # "<friendly_name> Library - <title>". Selecting by `integration:
          # plex` is therefore both correct and slug-agnostic. We use
          # `else:` (a fallback card rendered when zero entities match)
          # instead of `show_empty:false`, because some HA versions render
          # the zero-entity entities-card as a "Configuration error" tile.
          #
          # Excludes:
          # - unavailable/unknown sensors only.
          #
          # NOTE: previous versions also excluded "doubled-prefix" and
          # numeric-suffix (`_2`, `_3`) entities on the theory that they
          # were orphans from a re-added Plex integration. That was wrong
          # and actively harmful: HA appends `_N` whenever an entity_id is
          # already taken, so a perfectly healthy library can own
          # `sensor.<server>_library_music_2`. The old regex
          # `/^sensor\.plex_.+_library_.+_\d+$/` silently hid real
          # libraries. Scoping the include to `integration: plex` already
          # guarantees we only ever see genuine Plex library sensors, so
          # no orphan heuristics are needed.
          - type: custom:auto-entities
            card:
              type: entities
              state_color: false
            filter:
              include:
                - integration: plex
                  entity_id: /_library_/
                  options:
                    secondary_info: last-changed
              exclude:
                - state: "unavailable"
                - state: "unknown"
            sort:
              method: name
            else:
              type: markdown
              content: >-
                _No Plex library sensors found._<br>
                Enable them under **Settings → Devices & Services →
                Plex → Configure** and tick the libraries you want
                exposed as sensors.

      # =======================================================================
      # ROW 2 / FULL WIDTH – RECENTLY ADDED FILTER PILL
      # =======================================================================
      # The filter input_select sits above the 3-column poster row so it
      # visually anchors the "magazine" Recently Added section.
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Recently Added
            heading_style: title
            icon: mdi:new-box
          # Use auto-entities for the filter pill so a missing helper is
          # handled by `show_empty: false` rather than a conditional.
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
            filter:
              include:
                - entity_id: input_select.plex_dashboard_recently_added_filter
                  options:
                    name: Show

      # =======================================================================
      # ROW 3 / COLS 1-3 – RECENTLY ADDED POSTERS (Movies | Episodes | Music)
      # =======================================================================
      # Magazine-style 3-up poster grid. Each card uses an auto-entities
      # regex filter to discover the right sensor at render time (since
      # v2.3.3). The `plex_recently_added` HACS integration (v0.6+) emits
      # typed sensors per media type; the suffix uniquely identifies the
      # type:
      #   *recently_added_movie           -> Movies
      #   *recently_added_show            -> TV / Episodes
      #   *recently_added_(artist|music)  -> Music
      # The leading prefix varies by Plex server slug (e.g.
      # `sensor.plex_recently_added_movie` vs the doubled-prefix
      # `sensor.plex_plex_recently_added_movie`), so a regex match on the
      # suffix avoids any setup-time placeholder substitution and works
      # regardless of slug.
      #
      # `max: 4` per column keeps each tile compact -- 3 columns × 4 = 12
      # tiles total visible without scrolling, vs the v2.3.x single-column
      # 6-tile layout that hid 2/3 of the Recently Added content.
      #
      # `else:` markdown collapses the card cleanly if no matching sensor
      # exists (integration not installed, or that media type doesn't
      # exist on this Plex server).
      # v2.4.2: the Recently Added filter pill is finally wired up. Section
      # `visibility` is expressed with `state_not` rather than `state` so it
      # fails OPEN: when `input_select.plex_dashboard_recently_added_filter`
      # does not exist (package YAML not installed) no condition matches, so
      # all three sections stay visible exactly as they did in v2.4.1.
      # With the helper present, "All" trips nothing and shows all three;
      # any specific choice hides the other two.
      - type: grid
        column_span: 1
        visibility:
          - condition: state
            entity: input_select.plex_dashboard_recently_added_filter
            state_not: TV
          - condition: state
            entity: input_select.plex_dashboard_recently_added_filter
            state_not: Music
        cards:
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: /^sensor\..*recently_added.*_movie$/
                  options:
                    type: custom:upcoming-media-card
                    entity: this.entity_id
                    title: New Movies
                    image_style: poster
                    max: 4
                    date: mmdd
            sort:
              method: name
              count: 1
            else:
              type: markdown
              content: >-
                _New Movies sensor not found._<br>
                Install [plex_recently_added](https://github.com/custom-components/sensor.plex_recently_added)
                v0.6+ to populate this card.

      - type: grid
        column_span: 1
        visibility:
          - condition: state
            entity: input_select.plex_dashboard_recently_added_filter
            state_not: Movies
          - condition: state
            entity: input_select.plex_dashboard_recently_added_filter
            state_not: Music
        cards:
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: /^sensor\..*recently_added.*_show$/
                  options:
                    type: custom:upcoming-media-card
                    entity: this.entity_id
                    title: New Episodes
                    image_style: poster
                    max: 4
                    date: mmdd
            sort:
              method: name
              count: 1
            else:
              type: markdown
              content: >-
                _New Episodes sensor not found._<br>
                Install [plex_recently_added](https://github.com/custom-components/sensor.plex_recently_added)
                v0.6+ to populate this card.

      - type: grid
        column_span: 1
        visibility:
          - condition: state
            entity: input_select.plex_dashboard_recently_added_filter
            state_not: Movies
          - condition: state
            entity: input_select.plex_dashboard_recently_added_filter
            state_not: TV
        cards:
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - entity_id: /^sensor\..*recently_added.*_(artist|music)$/
                  options:
                    type: custom:upcoming-media-card
                    entity: this.entity_id
                    title: New Music
                    image_style: poster
                    max: 4
                    date: mmdd
            sort:
              method: name
              count: 1
            else:
              type: markdown
              content: >-
                _New Music sensor not found._<br>
                Install [plex_recently_added](https://github.com/custom-components/sensor.plex_recently_added)
                v0.6+ with a Plex music library to populate this card.

  # ===========================================================================
  # SECONDARY VIEW – Coming Soon (Sonarr / Radarr)
  # ===========================================================================
  - title: Coming Soon
    path: coming-soon
    icon: mdi:calendar-clock
    type: sections
    max_columns: 4
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Upcoming Movies (Radarr)
            icon: mdi:movie-roll
          # v2.4.2: rebuilt on Radarr's own calendar entity.
          #
          # Through v2.4.1 this card read `sensor.radarr_upcoming_media`,
          # which the core Radarr integration does NOT provide -- that entity
          # comes from the separate `radarr_upcoming_media` HACS custom
          # component. On any install without that component the sensor never
          # exists, so this card only ever rendered its `else:` placeholder
          # and the entire Coming Soon view was dead on arrival.
          #
          # The core Radarr integration does expose a calendar entity, so we
          # render it with HA's built-in `calendar` card. Its entity_id is
          # derived from the Radarr *instance* name chosen at config-flow
          # time (e.g. `calendar.rumpus_room_radarr`), never a fixed slug, so
          # it must be discovered rather than hardcoded.
          #
          # Selection is by `integration:` + `domain:`, NOT an entity_id
          # regex. A regex like /calendar\..*radarr.*/ also catches manually
          # created ICS calendars, whose entity_id and friendly name need not
          # agree -- on the reference system `calendar.radarr` is actually
          # named "Lidarr", so a name-sorted regex match picked the wrong
          # calendar entirely.
          #
          # auto-entities substitutes `this.entity_id` by stringifying the
          # whole options object and regex-replacing it, so the token
          # resolves correctly even nested inside the `entities:` list.
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - integration: radarr
                  domain: calendar
                  options:
                    type: calendar
                    initial_view: listWeek
                    entities:
                      - this.entity_id
            sort:
              method: name
              count: 1
            else:
              type: markdown
              content: >-
                _No Radarr calendar found._<br>
                Add the [Radarr integration](https://www.home-assistant.io/integrations/radarr/)
                to populate this list.

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Upcoming Episodes (Sonarr)
            icon: mdi:television-classic
          # Sonarr is optional. Same pattern and same rationale as Radarr
          # above -- `sensor.sonarr_upcoming_media` was never a core Sonarr
          # entity either.
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - integration: sonarr
                  domain: calendar
                  options:
                    type: calendar
                    initial_view: listWeek
                    entities:
                      - this.entity_id
            sort:
              method: name
              count: 1
            else:
              type: markdown
              content: >-
                _No Sonarr calendar found._<br>
                Add the [Sonarr integration](https://www.home-assistant.io/integrations/sonarr/)
                to populate this list.

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Settings
            icon: mdi:cog
          # Helpers are created by the bundled package YAML. Wrapped in
          # auto-entities so missing helpers collapse instead of
          # rendering "Entity not found" rows.
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
            filter:
              include:
                - entity_id: input_boolean.plex_dashboard_show_paused
                - entity_id: input_boolean.plex_dashboard_show_offline_clients
                - entity_id: input_select.plex_dashboard_recently_added_filter
